// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 26
        compileSdkVersion = 34
        targetSdkVersion = 35
        // 1.9.x is required to compile against intercom-android 15.x (built with Kotlin 1.9 metadata)
        kotlinVersion = "1.9.24"
        ndkVersion = "24.0.8215888"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Newer standalone R8/D8: AGP 7.4.2's built-in D8 NPEs ("Error while dexing")
        // on late-2024 androidx/intercom artifacts pulled in by intercom-sdk 15.14
        // (fragment 1.8.5, constraintlayout 2.2.0, profileinstaller 1.4.0). Must be
        // declared BEFORE the android gradle plugin to take precedence on the classpath.
        classpath('com.android.tools:r8:8.3.37')
        classpath('com.android.tools.build:gradle:7.4.2')
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlinVersion}")
        classpath 'com.google.gms:google-services:4.3.15'
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("de.undercouch:gradle-download-task:4.1.2")
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }

    allprojects {
        configurations.configureEach {
            resolutionStrategy {
                force "com.facebook.soloader:soloader:0.10.4"
            }
        }
        repositories {
            google()
            mavenCentral()
            mavenLocal()
            jcenter()
            maven {
                // expo-camera bundles a custom com.google.android:cameraview
                url "$rootDir/../node_modules/expo-camera/android/maven"
            }
            // Remember to include the following sdk to build project
            maven {
                url "file:${project.rootDir}/tapandpay_sdk/"
            }
        }
    }
}
